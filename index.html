<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Character Runner</title>
<meta name="description" content="Offline D&D 2024 character sheets for the group.">
<meta name="theme-color" content="#211915">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Char Runner">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"><div class="loader" id="loader" role="status" aria-live="polite">
  <svg class="ld-d20" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M12 7l5 8H7z"/><path d="M12 2v5M21 7l-4 8M3 7l4 8M12 22v-7M7 15l-4 2M17 15l4 2"/></svg>
  <h1 class="ld-title">Character Runner</h1>
  <div class="ld-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="5" id="ld-bar"><i id="ld-fill"></i></div>
  <p class="ld-step" id="ld-step">Starting up&hellip;</p>
  <div class="ld-help" id="ld-help" hidden>
    <p id="ld-why"></p>
    <button class="btn pri" type="button" id="ld-reload">Reload</button>
    <button class="btn" type="button" id="ld-reset">Clear app files and reload</button>
    <p class="ld-note">Your characters are not touched by either button.</p>
  </div>
</div></div>
<div id="roll-root"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="term-pop" role="dialog" aria-live="polite"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="hpfloat" aria-hidden="true"></div>
<script type="module" src="js/app.js"></script>
<script>
// Opened by double-clicking the file? Browsers block the app's code that way.
(function () {
  var box = function (title, body) {
    document.getElementById("app").innerHTML = '<div class="empty"><h3>' + title + '</h3><p>' + body + '</p></div>';
  };
  if (location.protocol === "file:") {
    box("Open the web link instead", "This app can't run from a downloaded file — browsers block it. Open your group's Character Runner link (it ends in github.io) and install it from there.");
    return;
  }
  // Loading progress: the app reports each stage here. If nothing moves for a while, say so and offer a way out.
  var last = "Starting up", lastAt = Date.now(), stage = 0, done = false;
  var $ = function (id) { return document.getElementById(id); };
  window.__boot = function (pct, text) {
    lastAt = Date.now(); stage = pct; if (text) last = text;
    var f = $("ld-fill"); if (!f) return;
    f.style.width = pct + "%"; $("ld-bar").setAttribute("aria-valuenow", pct);
    if (text) $("ld-step").textContent = text + "\u2026";
    $("ld-help").hidden = true; $("ld-bar").classList.remove("stuck");
    if (pct >= 100) done = true;
  };
  var trouble = function (why) {
    if (done || !$("ld-help")) return;
    $("ld-bar").classList.add("stuck"); $("ld-help").hidden = false; $("ld-why").textContent = why;
  };
  setInterval(function () {
    if (done) return;
    var idle = Date.now() - lastAt;
    if (idle > 8000) trouble(stage === 0 ? "The app code has not started. Your connection may be slow, or this browser may be too old." : "Stuck on: " + last + ". It has not moved for " + Math.round(idle / 1000) + " seconds.");
    else if (idle > 4000 && $("ld-step") && !$("ld-bar").classList.contains("slow")) $("ld-bar").classList.add("slow");
  }, 1000);
  window.addEventListener("error", function (e) { trouble("Something went wrong while starting: " + (e.message || "unknown error")); });
  window.addEventListener("unhandledrejection", function (e) { trouble("Something went wrong while starting: " + ((e.reason && e.reason.message) || "unknown error")); });
  document.getElementById("ld-reload").onclick = function () { location.reload(); };
  document.getElementById("ld-reset").onclick = function () {
    this.disabled = true; this.textContent = "Clearing\u2026";
    var go = function () { location.reload(); };
    Promise.all([
      navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }) : 0,
      window.caches ? caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }) : 0
    ]).then(go, go);
  };
})();
</script>
<noscript><div class="empty"><h3>Turn on JavaScript</h3><p>Character Runner needs JavaScript to run.</p></div></noscript>
<div id="update-bar" hidden role="status"><span>An update is ready.</span><button class="btn sm pri" type="button" id="update-go">Update now</button></div>
<script>
// Install button: browsers fire this once, possibly before the app code loads.
window.__installPrompt = null;
window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault(); window.__installPrompt = e;
  window.dispatchEvent(new Event("cr-install-change"));
});
window.addEventListener("appinstalled", function () {
  window.__installPrompt = null; window.dispatchEvent(new Event("cr-install-change"));
});
// Updates: a new release downloads whole in the background. If it was ready
// when the app opened (or arrives in the first few seconds before you touch
// anything), it's applied right away. Otherwise a bar offers "Update now".
if ("serviceWorker" in navigator) {
  (function () {
    var hadController = !!navigator.serviceWorker.controller, bootAt = Date.now(), touched = false, reloading = false;
    ["pointerdown", "keydown"].forEach(function (t) { window.addEventListener(t, function () { touched = true; }, { once: true, capture: true }); });
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (!hadController || reloading) return; reloading = true; location.reload();
    });
    function apply(reg) { if (reg.waiting) reg.waiting.postMessage("apply-update"); }
    function offer(reg) {
      if (!navigator.serviceWorker.controller) return; // first visit: nothing old to replace
      if (!touched && Date.now() - bootAt < 5000) return apply(reg);
      var bar = document.getElementById("update-bar");
      bar.hidden = false;
      document.getElementById("update-go").onclick = function () { this.disabled = true; this.textContent = "Updating…"; apply(reg); };
    }
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js").then(function (reg) {
        window.__swReg = reg;
        if (reg.waiting) offer(reg);
        reg.addEventListener("updatefound", function () {
          var w = reg.installing; if (!w) return;
          w.addEventListener("statechange", function () { if (w.state === "installed") offer(reg); });
        });
        var check = function () { reg.update().catch(function () {}); };
        document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
        window.addEventListener("online", check);
        setInterval(check, 30 * 60 * 1000);
      }).catch(function () {});
    });
  })();
}
</script>
</body>
</html>
